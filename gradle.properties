pluginGroup = dev.penguinxaml
pluginVersion = 0.1.0
# Free IDE the plugin is compiled against: 2026.1, the oldest platform Penguin XAML supports, so the zip can't use
# anything only newer platforms have. UI checks run in this IDE too (the sandbox Rider needs a login).
ideaVersion = 2026.1.5.1
riderVersion = 2026.2.4.1
kotlin.stdlib.default.dependency = false
org.gradle.jvmargs = -Xmx3g
org.gradle.configuration-cache = false
org.gradle.caching = true
